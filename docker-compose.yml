# Open WebUI is the application; legacy sources/data are retained for rollback.
# Existing Anonymizer and Ollama remain external internal-network services.
name: intecha-chat
services:
  webui:
    build:
      context: .
      args:
        OPENWEBUI_IMAGE: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded}
        INTECHA_REBRANDING_CONFIRMED: ${INTECHA_REBRANDING_CONFIRMED:?Confirm licensed rebranding}
    image: intecha-chat:0.12.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INTECHA_PREVIEW_PORT:-3080}:8080"
    environment:
      WEBUI_NAME: Intecha
      DEFAULT_LOCALE: it-IT
      CORS_ALLOW_ORIGIN: "https://chatbot.intecha.dev;http://127.0.0.1:3080;http://127.0.0.1:13080"
      WEBUI_URL: ${WEBUI_URL:-https://chatbot.intecha.dev}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set persistent secret}
      ENABLE_SIGNUP: "false"
      DEFAULT_USER_ROLE: pending
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_DIRECT_CONNECTIONS: "false"
      ENABLE_DIRECT_INTEGRATIONS: "false"
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: http://privacy-gateway:8081/v1
      OPENAI_API_KEY: ${GATEWAY_API_KEY:?Set gateway secret}
      DEFAULT_MODELS: ${DEEPSEEK_CHAT_MODEL:-deepseek-flash}
      DEFAULT_MODEL_PARAMS: '{"function_calling":"native"}'
      DEFAULT_MODEL_METADATA: '{"capabilities":{"vision":false,"builtin_tools":true},"builtin_tools":{"knowledge":true}}'
      TASK_MODEL_EXTERNAL: ${DEEPSEEK_CHAT_MODEL:-deepseek-flash}
      ENABLE_ADMIN_CHAT_ACCESS: "false"
      ENABLE_ADMIN_EXPORT: "false"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_WEB_SEARCH: "false"
      ENABLE_IMAGE_GENERATION: "false"
      ENABLE_IMAGE_EDIT: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS: "false"
      RAG_EMBEDDING_ENGINE: ollama
      RAG_EMBEDDING_MODEL: nomic-embed-text
      RAG_OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      RAG_EMBEDDING_QUERY_PREFIX: "search_query: "
      RAG_EMBEDDING_CONTENT_PREFIX: "search_document: "
      ENABLE_RAG_HYBRID_SEARCH: "true"
      ENABLE_RAG_HYBRID_SEARCH_ENRICHED_TEXTS: "true"
      RAG_TOP_K: "12"
      RAG_TOP_K_RERANKER: "8"
      CHUNK_SIZE: "1200"
      CHUNK_OVERLAP: "150"
      RAG_RELEVANCE_THRESHOLD: "0"
      CONTENT_EXTRACTION_ENGINE: ""
      PDF_EXTRACT_IMAGES: "false"
      VECTOR_DB: chroma
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
      SCARF_NO_ANALYTICS: "true"
    volumes:
      - webui-data:/app/backend/data
    networks:
      - private
      - infrastructure
    depends_on:
      privacy-gateway:
        condition: service_healthy

  privacy-gateway:
    build: ./services/privacy-gateway
    image: intecha-privacy-gateway:1
    restart: unless-stopped
    environment:
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?Set gateway secret}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set provider secret only in gateway}
      GATEWAY_MODELS: ${DEEPSEEK_CHAT_MODEL:-deepseek-flash}
      ANONYMIZER_URL: ${ANONYMIZER_URL:-http://anonymizer:8000}
      ANONYMIZER_TOKEN: ${ANONYMIZER_TOKEN:?Set existing anonymizer token}
    networks:
      - private
      - infrastructure
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  webui-data:
    name: intecha-openwebui-data

networks:
  private:
    internal: true
  infrastructure:
    name: ${INTECHA_NETWORK:-coolify}
    external: true
